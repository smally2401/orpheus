[package]
name = "orpheus"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

[dependencies]
anyhow = "1.0.103"
async-executor = "1.14.0"
dirs = "6.0.0"
futures-lite = "2.6.1"
image = "0.25.10"
lofty = "0.24.0"
mlua = { version = "0.11", features = ["lua54", "vendored" ] }
mpris-server = "0.10.0"
paste = "1.0.15"
rand = "0.10.2"
rodio = { version = "0.22.2", features = ["playback", "mp3", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.17.0"
strum = "0.28.0"
tokio = { version = "1.52.3", features = ["full"] }
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"

[build-dependencies]
slint-build = "1.17.0"

[profile.small-binary]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
